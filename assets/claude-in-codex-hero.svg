<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="claude-in-codex — run Claude Code from inside Codex">
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#191734"/>
      <stop offset="60%" stop-color="#0C0B1A"/>
      <stop offset="100%" stop-color="#070610"/>
    </radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10A37F"/>
      <stop offset="50%" stop-color="#7B39FE"/>
      <stop offset="100%" stop-color="#D97757"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E7DEFF"/>
      <stop offset="100%" stop-color="#B79BFF"/>
    </linearGradient>
    <radialGradient id="codexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10A37F" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#10A37F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="claudeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D97757" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
      @keyframes breathe { 0%,100% { opacity:.35 } 50% { opacity:.9 } }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
      .halo { animation: breathe 4s ease-in-out infinite; }
      .drift { animation: float 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Panel -->
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="378" rx="27" fill="none" stroke="#7B39FE" stroke-opacity=".18"/>

  <!-- Drifting particles -->
  <g fill="#7B39FE" opacity=".5">
    <circle class="drift" cx="150" cy="70" r="2" style="animation-delay:0s"/>
    <circle class="drift" cx="1040" cy="90" r="2.5" style="animation-delay:1.5s"/>
    <circle class="drift" cx="600" cy="48" r="2" style="animation-delay:2.4s"/>
    <circle class="drift" cx="300" cy="320" r="2.5" style="animation-delay:.8s"/>
    <circle class="drift" cx="900" cy="310" r="2" style="animation-delay:3s"/>
  </g>

  <!-- Connection wire between the two engines -->
  <path id="link" d="M 300 190 C 470 120, 730 260, 900 190" fill="none"
        stroke="url(#wire)" stroke-width="3" stroke-opacity=".55" stroke-linecap="round"/>

  <!-- Pulses traveling along the wire (bidirectional delegation) -->
  <circle r="6" fill="#B79BFF">
    <animateMotion dur="2.6s" repeatCount="indefinite" rotate="auto"
      keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1">
      <mpath href="#link"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#7BE0C4">
    <animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" rotate="auto"
      keyPoints="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1">
      <mpath href="#link"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
  </circle>

  <!-- Codex node (host) -->
  <g transform="translate(300 190)">
    <circle class="halo" r="70" fill="url(#codexGlow)"/>
    <circle r="46" fill="#0E1512" stroke="#10A37F" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" class="mono" font-size="30" fill="#3DDBB0" font-weight="700">&gt;_</text>
    <text x="0" y="84" text-anchor="middle" class="sans" font-size="16" fill="#8FB9AC" font-weight="600" letter-spacing="1">CODEX</text>
    <text x="0" y="104" text-anchor="middle" class="sans" font-size="11" fill="#5E7A70">host</text>
  </g>

  <!-- Claude node (engine) -->
  <g transform="translate(900 190)">
    <circle class="halo" r="70" fill="url(#claudeGlow)" style="animation-delay:2s"/>
    <circle r="46" fill="#1A110D" stroke="#D97757" stroke-width="2.5"/>
    <!-- Claude sunburst mark -->
    <g fill="#F0A585">
      <path d="M 0 -23 L 2.7 -5 L -2.7 -5 Z"/>
      <path d="M 0 -23 L 2.7 -5 L -2.7 -5 Z" transform="rotate(30)"/>
      <path d="M 0 -23 L 2.7 -5 L -2.7 -5 Z" transform="rotate(60)"/>
      <path d="M 0 -23 L 2.7 -5 L -2.7 -5 Z" transform="rotate(90)"/>
      <path d="M 0 -23 L 2.7 -5 L -2.7 -5 Z" transform="rotate(120)"/>
      <path d="M 0 -23 L 2.7 -5 L -2.7 -5 Z" transform="rotate(150)"/>
      <path d="M 0 -23 L 2.7 -5 L -2.7 -5 Z" transform="rotate(180)"/>
      <path d="M 0 -23 L 2.7 -5 L -2.7 -5 Z" transform="rotate(210)"/>
      <path d="M 0 -23 L 2.7 -5 L -2.7 -5 Z" transform="rotate(240)"/>
      <path d="M 0 -23 L 2.7 -5 L -2.7 -5 Z" transform="rotate(270)"/>
      <path d="M 0 -23 L 2.7 -5 L -2.7 -5 Z" transform="rotate(300)"/>
      <path d="M 0 -23 L 2.7 -5 L -2.7 -5 Z" transform="rotate(330)"/>
    </g>
    <text x="0" y="84" text-anchor="middle" class="sans" font-size="16" fill="#D9A48F" font-weight="600" letter-spacing="1">CLAUDE</text>
    <text x="0" y="104" text-anchor="middle" class="sans" font-size="11" fill="#8A6656">engine</text>
  </g>

  <!-- Wordmark -->
  <text x="600" y="300" text-anchor="middle" class="mono" font-size="52" font-weight="800" fill="url(#title)">claude-in-codex</text>
  <text x="600" y="338" text-anchor="middle" class="sans" font-size="18" fill="#9C8FD6">Run Claude Code reviews, rescues &amp; thread transfers — from inside Codex</text>
</svg>
